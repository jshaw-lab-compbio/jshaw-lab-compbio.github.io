# ---------------------------------------------------------------------------
# SOFTWARE
# One entry per tool. Order here = order on the Software page.
#
# color:       any hex code — the small identifying dot next to the tool's
#              name and the accent on its publication note.
# tagline:     one-line description shown under the name.
# description: optional extra text (e.g. credits). Omit if not needed.
# publication: optional — venue + year shown as a small note linking to the
#              paper. Omit for tools with nothing published yet.
# links:       optional list of {label, url}.
# ---------------------------------------------------------------------------

