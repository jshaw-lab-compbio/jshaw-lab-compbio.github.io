<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-header__brand" href="{{ '/' | relative_url }}">
      <span class="site-header__title">{{ site.title }}</span>
      <span class="site-header__tagline">{{ site.tagline }}</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav">
      {% for item in site.nav %}
        {% assign clean_url = item.url | remove: 'index.html' %}
        <a href="{{ item.url | relative_url }}"
           class="site-nav__link{% if page.url == clean_url %} is-active{% endif %}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.querySelector('.site-nav');
    if (!toggle || !nav) return;
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
    });
  });
</script>
